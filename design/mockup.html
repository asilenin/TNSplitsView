<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TSV-18 · макет в языке TN Watch Face</title>
<!-- TSV-18, шаг 0, вторая версия: один шрифт (Courier Prime Bold), плотность строк как на циферблате
     (кегль 26, шаг 30 при экране 454 — по фото циферблата на fr965), светлая тема с белым фоном и тёмная.
     Экран 454×454 круглый, как у fr965. -->
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --page: #161616; --ink: #cfcfcf; }
  body { margin: 0; padding: 24px; background: var(--page); color: var(--ink);
         font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  h2 { font-weight: 600; font-size: 15px; margin: 28px 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; }
  figure { margin: 0; }
  figcaption { margin-top: 10px; text-align: center; max-width: 494px; }
  .watch { width: 494px; height: 494px; border-radius: 50%; background: #2a2a2a; display: grid; place-items: center; }
  svg { display: block; }
</style>
</head>
<body>
<h2>Список кругов — 11 строк, 9 кругов, замер лактата и живой круг</h2>
<div class="row" id="list"></div>
<h2>Ввод лактата</h2>
<div class="row" id="input"></div>
<script>
const W = 454, C = W / 2, SW = 68;          // SW — зона переключения: 16% ширины минус 5 px, как в zoneW()
const FF = "'Courier Prime', 'Courier New', monospace";
const THEMES = {
  light: { name: 'Светлая, белый фон', bg: '#FFFFFF', fg: '#000000', dim: '#6A6A6A', line: '#C4C4C4',
           green: '#008A00', yellow: '#B08A00', orange: '#D95F00', red: '#D00000', blue: '#0086C8', okBg: '#000000', okFg: '#FFFFFF' },
  dark:  { name: 'Тёмная', bg: '#000000', fg: '#DCDCDC', dim: '#7A7A7A', line: '#3A3A3A',
           green: '#00DD00', yellow: '#FFFF00', orange: '#FF8800', red: '#FF4040', blue: '#33CCFF', okBg: '#DCDCDC', okFg: '#111111' },
};

// [номер, время, дистанция, темп, зона цвета] | ['LA', значение, время замера] | живой круг: зона 'live'
const ROWS = [
  [1, '4:58', '1.00', '4:58', 'green'],
  [2, '4:52', '1.00', '4:52', 'green'],
  [3, '4:41', '1.00', '4:41', 'green'],
  ['LA', '1,8', '14:12'],
  [4, '4:32', '1.00', '4:32', 'yellow'],
  [5, '4:19', '1.00', '4:19', 'orange'],
  [6, '4:07', '1.00', '4:07', 'red'],
  [7, '4:11', '1.00', '4:11', 'red'],
  [8, '4:15', '1.00', '4:15', 'orange'],
  [9, '4:09', '1.00', '4:09', 'red'],
  [10, '2:03', '0.48', '4:16', 'live'],
];
const PITCH = 30, FS = 26;

const svg = (t, inner, id) => `<svg width="${W}" height="${W}" viewBox="0 0 ${W} ${W}">
  <defs><clipPath id="${id}"><circle cx="${C}" cy="${C}" r="${C}"/></clipPath></defs>
  <g clip-path="url(#${id})"><rect width="${W}" height="${W}" fill="${t.bg}"/>${inner}</g></svg>`;
const txt = (x, y, s, fill, fs, anchor, ls) => `<text x="${x}" y="${y}" fill="${fill}" font-family="${FF}" font-weight="700" font-size="${fs}"
  text-anchor="${anchor || 'start'}" dominant-baseline="central" ${ls ? `letter-spacing="${ls}"` : ''}>${s}</text>`;
// Капля и стрелка нарисованы: в Courier Prime эмодзи нет.
const drop = (x, y, h, c) => { const k = h / 20;
  return `<path transform="translate(${x} ${y}) scale(${k})" d="M0 -10 C4 -4 7 -0.5 7 3.5 A7 7 0 0 1 -7 3.5 C-7 -0.5 -4 -4 0 -10 Z" fill="${c}"/>`; };
const chevron = (x, y, c, dir) => `<path d="M${x - 4 * dir} ${y - 8} L${x + 4 * dir} ${y} L${x - 4 * dir} ${y + 8}" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

// Список: цвет только у темпа и у замера, остальное — текст и серый. Колонки выровнены по правому краю, как в табличке циферблата.
function listScreen(t, id) {
  const cx = (W - SW) / 2 - 2, y0 = C - PITCH * (ROWS.length - 1) / 2; let s = '';
  ROWS.forEach((r, i) => {
    const y = y0 + i * PITCH;
    if (i === ROWS.length - 1) s += `<line x1="58" y1="${y - PITCH / 2}" x2="${W - SW - 8}" y2="${y - PITCH / 2}" stroke="${t.line}" stroke-width="2"/>`;
    if (r[0] === 'LA') {
      s += drop(cx - 118, y, 22, t.blue) + txt(cx - 22, y, r[1], t.blue, FS, 'end') + txt(cx + 150, y, r[2], t.dim, FS, 'end');
      return;
    }
    const live = r[4] === 'live';
    s += txt(cx - 104, y, r[0], t.dim, FS, 'end') + txt(cx - 22, y, r[1], t.fg, FS, 'end')
      + txt(cx + 62, y, r[2], t.dim, FS, 'end') + txt(cx + 150, y, r[3], live ? t.fg : t[r[4]], FS, 'end');
  });
  s += `<rect x="${W - SW + 14}" y="${C - 45}" width="${SW - 14}" height="90" rx="16" fill="none" stroke="${t.line}" stroke-width="2.5"/>`
    + drop(W - SW / 2 + 7, C - 16, 24, t.fg) + chevron(W - SW / 2 + 7, C + 24, t.fg, 1);
  return svg(t, s, id);
}

// Ввод: геометрия зон прежняя (3×2; плюсы сверху, минусы снизу, OK по центру снизу, значение по центру сверху).
// Заливок нет: зоны — линии, «+»/«−» — цветом текста, OK — единственная плотная плашка.
function inputScreen(t, id) {
  const cw = W / 3, rh = W / 2; let s = '';
  s += `<line x1="${cw}" y1="60" x2="${cw}" y2="${W - 60}" stroke="${t.line}" stroke-width="2"/>`
    + `<line x1="${2 * cw}" y1="60" x2="${2 * cw}" y2="${W - 60}" stroke="${t.line}" stroke-width="2"/>`
    + `<line x1="40" y1="${rh}" x2="${W - 40}" y2="${rh}" stroke="${t.line}" stroke-width="2"/>`;
  const tY = rh * 0.72, bY = rh + rh * 0.28;
  s += txt(cw / 2 + 10, tY, '+1', t.green, 40, 'middle') + txt(2.5 * cw - 10, tY, '+0,1', t.green, 34, 'middle')
    + txt(cw / 2 + 10, bY, '−1', t.red, 40, 'middle') + txt(2.5 * cw - 10, bY, '−0,1', t.red, 34, 'middle');
  s += drop(1.5 * cw - 50, rh * 0.30, 26, t.blue) + txt(1.5 * cw + 10, rh * 0.30, 'MMOL/L', t.dim, 16, 'middle', 2)
    + txt(1.5 * cw, tY - 4, '6,4', t.fg, 64, 'middle');
  s += `<rect x="${cw + 14}" y="${rh + 14}" width="${cw - 28}" height="${rh * 0.5}" rx="24" fill="${t.okBg}"/>`
    + txt(1.5 * cw, rh + 14 + rh * 0.25, 'OK', t.okFg, 38, 'middle');
  s += `<rect x="-20" y="${rh - 45}" width="${SW + 20 - 14}" height="90" rx="16" fill="none" stroke="${t.line}" stroke-width="2.5"/>`
    + chevron(SW / 2 - 7, rh - 24, t.fg, -1) + drop(SW / 2 - 7, rh + 16, 24, t.fg);
  return svg(t, s, id);
}

const fig = (id, html, cap) => document.getElementById(id).insertAdjacentHTML('beforeend',
  `<figure><div class="watch">${html}</div><figcaption>${cap}</figcaption></figure>`);
document.fonts.load("700 26px 'Courier Prime'").finally(() => {
  for (const k of ['light', 'dark']) {
    fig('list', listScreen(THEMES[k], 'l' + k), THEMES[k].name);
    fig('input', inputScreen(THEMES[k], 'i' + k), THEMES[k].name);
  }
});
</script>
</body>
</html>
